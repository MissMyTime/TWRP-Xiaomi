name: TWRP 16 — 红米 K90 Pro Max (myron)

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_BRANCH:
        description: "设备树分支"
        required: true
        default: "twrp_myron"

permissions:
  contents: write

concurrency:
  group: twrp-myron-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_TREE_URL: https://github.com/MissMyTime/android_device_xiaomi_myron
  DEVICE_PATH: xiaomi/myron
  DEVICE_NAME: myron
  PRODUCT_NAME: twrp_myron
  CCACHE_SIZE: 10G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: 显示构建信息
        run: |
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"
          echo "设备: 红米 K90 Pro Max"
          echo "代号: myron"
          echo "平台: SM8850 / canoe"
          echo "Android: 16 / API 36"
          echo "设备树分支: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "日期: $(date)"

      - name: 清理磁盘空间
        run: |
          echo "Before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift

          sudo apt-get clean
          sudo apt-get autoremove -y
          docker system prune -af || true

          echo "After cleanup:"
          df -h

      - name: 添加 swap
        run: |
          echo "Before swap:"
          free -h

          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          echo "After swap:"
          free -h
          swapon --show

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip rsync ccache bc libssl-dev \
            libncurses-dev liblz4-tool lz4 zstd

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          mkdir -p ~/.bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: 初始化 TWRP 16 源码
        run: |
          mkdir -p "${{ github.workspace }}/work"
          cd "${{ github.workspace }}/work"

          repo init --depth=1 --no-clone-bundle --no-tags \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0

      - name: 缓存 repo 源
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/work/.repo
          key: repo-twrp16-${{ github.run_id }}
          restore-keys: |
            repo-twrp16-

      - name: 同步源码
        timeout-minutes: 240
        run: |
          cd "${{ github.workspace }}/work"

          repo sync -c -j4 --fail-fast --no-tags --no-clone-bundle

      - name: 克隆设备树
        run: |
          cd "${{ github.workspace }}/work"

          rm -rf "device/${{ env.DEVICE_PATH }}"

          git clone --depth=1 \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ env.DEVICE_TREE_URL }}" \
            "device/${{ env.DEVICE_PATH }}"

          echo "Device tree commit:"
          git -C "device/${{ env.DEVICE_PATH }}" log --oneline -1

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-twrp16-${{ env.DEVICE_NAME }}-${{ github.run_id }}
          restore-keys: |
            ccache-twrp16-${{ env.DEVICE_NAME }}-

      - name: 配置 ccache
        run: |
          ccache -M "${{ env.CCACHE_SIZE }}"
          ccache -o compression=true
          ccache -o compression_level=6
          ccache -s
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"

      - name: 编译 TWRP
        timeout-minutes: 360
        run: |
          cd "${{ github.workspace }}/work"

          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1

          # Clean previous build artifacts to avoid corrupted ninja state
          rm -rf out

          # Avoid GitHub runner OOM during Soong/ninja stages.
          export NINJA_ARGS="-j1"

          source build/envsetup.sh

          echo "Available twrp lunch combos:"
          lunch 2>&1 | grep "twrp_" || true

          DEVICE="${{ env.DEVICE_NAME }}"
          LUNCH_OK=0

          for RELEASE in "bp2a" "ap2a" "ap3a" "trunk_staging" "trunk" ""; do
            if [ -z "$RELEASE" ]; then
              COMBO="twrp_${DEVICE}-eng"
            else
              COMBO="twrp_${DEVICE}-${RELEASE}-eng"
            fi

            echo "Trying lunch: $COMBO"

            if lunch "$COMBO"; then
              LUNCH_OK=1
              echo "Lunch success: $COMBO"
              break
            fi
          done

          if [ "$LUNCH_OK" -eq 0 ]; then
            echo "ERROR: No valid lunch combo found."
            exit 1
          fi

          mka -j1 recoveryimage

      - name: 查看输出文件
        if: always()
        run: |
          echo "Output directory:"
          ls -lah "${{ github.workspace }}/work/out/target/product/${{ env.DEVICE_NAME }}" || true

          echo "ccache stats:"
          ccache -s || true

          echo "Disk usage:"
          df -h

          echo "Memory:"
          free -h

      - name: 上传 Recovery 产物
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-16-myron-${{ env.BUILD_DATE }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/work/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
            ${{ github.workspace }}/work/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          if-no-files-found: warn

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/work/out/target/product/${{ env.DEVICE_NAME }}/recovery.img
          name: TWRP-16-RedmiK90ProMax-${{ env.BUILD_DATE }}-${{ github.run_number }}
          tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
          fail_on_unmatched_files: false
